<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Mojoto — A fresh take on Mojo.</title>
  <desc id="desc">Mint green Mojoto lettering on a dark green background, with an abstract lime and sparkling bubbles.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102c28"/><stop offset="1" stop-color="#071a19"/></linearGradient>
    <linearGradient id="lime" x2="1" y2="1"><stop stop-color="#d5ff79"/><stop offset="1" stop-color="#64e5b3"/></linearGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#31564a" opacity=".45">
    <circle cx="1050" cy="205" r="260"/><circle cx="1050" cy="205" r="205"/>
    <path d="M760 0v400M0 340h1280"/>
  </g>
  <text x="72" y="72" fill="#a6cfbb" font-family="Helvetica,Arial,sans-serif" font-size="14" letter-spacing="4">SMALL LIBRARIES. FRESH IDEAS.</text>
  <text x="66" y="205" fill="#d5ffad" font-family="Helvetica,Arial,sans-serif" font-size="112" font-weight="700" letter-spacing="-6">Mojoto<tspan fill="#69e5b1">.</tspan></text>
  <text x="72" y="267" fill="#f0f8ee" font-family="Helvetica,Arial,sans-serif" font-size="29">A fresh take on Mojo.</text>
  <text x="72" y="365" fill="#a6cfbb" font-family="Helvetica,Arial,sans-serif" font-size="15">OPEN SOURCE  /  BUILT WITH MOJO</text>
  <g transform="translate(1030 194) rotate(-25)">
    <circle r="112" fill="url(#lime)"/>
    <circle r="94" fill="#183f32"/>
    <circle r="84" fill="#baf080"/>
