      <path d="M0-84V84M-84 0H84M-59-59 59 59M-59 59 59-59"/>
      <circle r="10" fill="#e7ffbd"/>
    </g>
    <path d="M27-105Q35-164 101-151Q91-100 27-105" fill="#68dda4"/>
    <path d="m31-110 52-28" fill="none" stroke="#173e31" stroke-width="3"/>
